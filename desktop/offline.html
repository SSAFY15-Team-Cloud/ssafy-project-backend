<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Meetiny</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1530;
        color: #fff;
        font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      }
      .box { text-align: center; }
      .orb {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 999px;
        background: radial-gradient(circle at 35% 30%, #a5b4fc, #4338ca 72%);
        box-shadow: 0 0 24px rgba(141, 162, 255, 0.5);
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 13px; color: rgba(255, 255, 255, 0.55); margin: 0 0 24px; line-height: 1.7; }
      code {
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 12px;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: #5276df;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 28px;
        cursor: pointer;
      }
      button:hover { background: #4265c9; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="orb"></div>
      <h1>Meetiny 서버에 연결할 수 없어요</h1>
      <p>
        프론트 서버가 꺼져있는 것 같아요.<br />
        <code>cd frontend &amp;&amp; npm run dev</code> 실행 후 다시 시도해주세요.
      </p>
      <button onclick="location.href='http://localhost:5173'">다시 연결</button>
    </div>
  </body>
</html>
