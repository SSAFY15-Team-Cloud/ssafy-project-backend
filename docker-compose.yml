name: ssafy-meeting

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting-postgres
    environment:
      POSTGRES_DB: ssafy_project
      POSTGRES_USER: ssafy
      POSTGRES_PASSWORD: ssafy
    ports:
      # 호스트에 로컬 PostgreSQL이 5432를 쓰는 경우가 많아 5433으로 노출
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssafy -d ssafy_project"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meeting-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: meeting-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ssafy
      RABBITMQ_DEFAULT_PASS: ssafy
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: meeting-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 최초 기동 시 버킷 생성 (앱이 presigned URL 방식으로 접근하므로 정책 변경 불필요)
  minio-init:
    image: minio/mc:latest
    container_name: meeting-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/meeting-media &&
      mc anonymous set download local/meeting-media &&
      echo 'bucket ready'
      "

  livekit:
    image: livekit/livekit-server:latest
    container_name: meeting-livekit
    command: --config /etc/livekit.yaml --bind 0.0.0.0 --node-ip 127.0.0.1
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"       # HTTP / WebSocket signaling
      - "7881:7881"       # ICE over TCP
      - "7882:7882/udp"   # ICE UDP (dev mode port muxing)

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
