spring.application.name=SSAFY_PROJECT
server.port=${SERVER_PORT:8081}

# 로컬 시크릿 (gitignore, 없어도 기동 가능)
spring.config.import=optional:classpath:secrets.properties

# --- PostgreSQL (docker-compose: pgvector/pgvector:pg16) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ssafy_project}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ssafy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ssafy}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Redis (docker-compose: redis:7) ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.cache.type=redis

# --- JWT ---
secret_key=${SECRET_KEY:a74fa26c5b3a5513725b76c8ce0f124861bad33285d2bd3a9aff76b4d7e23ffa}
jwt.expiration=${JWT_EXPIRATION:1800000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# --- S3 호환 스토리지 (docker-compose: MinIO) ---
# endpoint를 지정하면 path-style 접근을 사용한다. 실제 AWS S3를 쓰려면 endpoint를 비우면 된다.
cloud.aws.credentials.accessKey=${CLOUD_AWS_ACCESS_KEY:minioadmin}
cloud.aws.credentials.secretKey=${CLOUD_AWS_SECRET_KEY:minioadmin}
cloud.aws.region.static=${CLOUD_AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${CLOUD_AWS_S3_BUCKET:meeting-media}
cloud.aws.s3.endpoint=${CLOUD_AWS_S3_ENDPOINT:http://localhost:9000}
cloud.aws.s3.presigned-url-expiration-seconds=${CLOUD_AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}

app.profile-image.base-url=${APP_PROFILE_IMAGE_BASE_URL:http://localhost:9000/meeting-media}
app.profile-image.prefix=images/profiles
app.audio.prefix=rooms/

# --- OpenAI (키는 secrets.properties 또는 환경변수로) ---
openai.api.key=${OPENAI_API_KEY:}
app.openai.report-summary-model=${APP_OPENAI_REPORT_SUMMARY_MODEL:gpt-4o-mini}
app.openai.insight-model=${APP_OPENAI_INSIGHT_MODEL:gpt-4o-mini}
app.openai.embedding-model=${APP_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# --- LiveKit (docker-compose: livekit dev mode) ---
livekit.url=${LIVEKIT_URL:ws://localhost:7880}
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:wJqzX0m8Qf3tR7vY2sN5uB9cD4eG6hK1}

# --- 프론트엔드 (초대 딥링크 생성용) ---
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# --- RabbitMQ (docker-compose: rabbitmq:3.13-management) ---
app.rabbitmq.enabled=${APP_RABBITMQ_ENABLED:true}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:ssafy}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:ssafy}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000
management.health.rabbit.enabled=${APP_RABBITMQ_ENABLED:true}
